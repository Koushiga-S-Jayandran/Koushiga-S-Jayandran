<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 800px;
      height: 800px;
      background: #9FA2A6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .card {
      width: 580px;
      height: 580px;
      border-radius: 50%;
      background: linear-gradient(135deg, #16181D 0%, #0C0E12 100%);
      border: 4px solid #7FA6E0;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 32px rgba(127,166,224,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .inner-ring {
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      border: 1.5px dashed rgba(127, 166, 224, 0.4);
    }
    .shield-icon {
      width: 72px;
      height: 72px;
      color: #7FA6E0;
      margin-bottom: 12px;
    }
    .monogram {
      font-family: Georgia, 'Instrument Serif', serif;
      font-size: 110px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 8px;
      line-height: 1;
      margin-bottom: 16px;
    }
    .name {
      font-size: 15px;
      font-weight: 600;
      color: #7FA6E0;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 11px;
      font-weight: 500;
      color: #9AA3AF;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="inner-ring"></div>
    <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <path d="m9 12 2 2 4-4"/>
    </svg>
    <div class="monogram">KSJ</div>
    <div class="name">Koushiga S. Jayandran</div>
    <div class="subtitle">Cybersecurity &amp; Security Engineering</div>
  </div>
</body>
</html>
